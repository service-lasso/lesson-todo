name: openbao-e2e

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "lessons/07-openbao/**"
      - "scripts/e2e-openbao.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/openbao-e2e.yml"

permissions:
  contents: read

jobs:
  full-stack:
    name: Full Service Lasso OpenBao stack
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install lesson dependencies
        run: npm ci

      - name: Run OpenBao full-stack E2E
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run e2e:openbao

      - name: Upload E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openbao-e2e-evidence
          path: output/e2e-openbao
          if-no-files-found: warn
